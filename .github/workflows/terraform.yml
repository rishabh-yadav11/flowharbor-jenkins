name: Terraform

on:
  push:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

jobs:
  iac:
    name: terraform fmt/validate + misconfig scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # -backend=false is mandatory: the state backend stays local, so CI must
      # never need AWS credentials to validate the configuration.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false
          working-directory: terraform

      - name: terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: terraform init
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: terraform
        run: terraform validate

      # Runs from the repository root so scan-ref and ignorefile both resolve.
      - name: Trivy misconfiguration scan
        uses: aquasecurity/trivy-action@0.33.0
        with:
          scan-type: misconfig
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignorefile: .trivyignore
