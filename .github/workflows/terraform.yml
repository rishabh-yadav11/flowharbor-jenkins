name: Terraform

on:
  push:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
      # A change to the suppression file must re-run the scan, or a
      # suppression could be widened with nothing ever re-checking it.
      - ".trivyignore"
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
      - ".trivyignore"

permissions:
  contents: read

jobs:
  iac:
    name: terraform fmt/validate + misconfig scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # -backend=false is mandatory: the state backend stays local, so CI must
      # never need AWS credentials to validate the configuration.
      # No `working-directory` here: setup-terraform takes only
      # cli_config_credentials_*, terraform_version and terraform_wrapper, and
      # an unknown input fails the run before a single command executes. The
      # directory is set on the `run` steps below, which is where GitHub
      # supports it.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: terraform init
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: terraform
        run: terraform validate

      # Runs from the repository root so scan-ref and the ignore file resolve.
      - name: Trivy misconfiguration scan
        # The tag is v-prefixed (`0.33.0` is not a ref), and the input is
        # `trivyignores` — `ignorefile` is not an input of this action. Both
        # mistakes fail at action-input validation, before the scan runs.
        uses: aquasecurity/trivy-action@0.35.0
        with:
          # The action passes scan-type straight through as the Trivy
          # subcommand, and `misconfig` was folded into `config` upstream:
          # with the old value the step dies with
          # `unknown command "misconfig" for "trivy"`.
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
          # The action defaults to a Trivy whose contrib/install.sh no longer
          # resolves a release asset, so the step dies in setup before the scan
          # runs. Pin the version the offline scan was verified with, so CI and
          # a local `trivy config` report the same findings.
          version: v0.74.0
